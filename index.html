T", "intro": "Nomeie sem julgar, encontre o gatilho e retome pequeno.", "fields": [["nomear", "O que aconteceu, sem julgamento?", "textarea"], ["gatilho", "Qual foi o gatilho?", "textarea"], ["retomar", "Qual é a menor retomada possível nas próximas 24h?", "textarea"], ["apoio", "Quem pode te apoiar nisso essa semana? (opcional)", "textarea"]]}, {"match": "Carta ao Eu Anterior", "title": "Carta ao Eu Anterior", "intro": "Escreva para a versão de você que ainda estava no meio da queda.", "fields": [["carta", "Sua carta", "textarea"]]}, {"match": "Cronograma RESET de 30 Dias", "title": "Cronograma RESET de 30 Dias", "intro": "Use como sequência flexível. Se a escala pedir mais tempo, repita a fase.", "checks": ["Semana 1 — Matriz da Queda, sintomas, prontidão e início da estabilização física", "Semanas 2–3 — Painéis físico e financeiro, distanciamento e mapa de emoções", "Final da semana 3 — Repetir a Escala e escolher um hábito, se estiver pronto", "Semana 4 — Sustentar o hábito, usar o protocolo de recaída e fazer uma breve reflexão"]}, {"match": "Checklist de Revisão Trimestral", "title": "Checklist de Revisão Trimestral RESET", "intro": "De vez em quando, vale parar e olhar para trás — não para cobrar, só para ajustar o que for preciso.", "fields": [["gatilhos", "Os gatilhos ainda são automáticos?", "textarea"], ["meta", "A meta mínima ainda é realmente mínima?", "textarea"], ["recompensa", "A recompensa ainda reforça o hábito?", "textarea"], ["metrica", "A métrica está sendo preenchida com honestidade?", "textarea"], ["estabilizacao", "Alguma área de estabilização regrediu?", "textarea"], ["padrao", "Algum padrão antigo está ressurgindo?", "textarea"], ["identidade", "A identidade construída está sendo reforçada?", "textarea"], ["ambiente", "O que mudou no ambiente ou na vida?", "textarea"]]}, {"match": "Painel de Manutenção Anual", "title": "Painel de Manutenção Anual RESET", "intro": "Marque quatro check-ins ao longo dos próximos doze meses.", "fields": [["q1", "Check-in 1 — data e estado geral", "textarea"], ["q2", "Check-in 2 — data e estado geral", "textarea"], ["q3", "Check-in 3 — data e estado geral", "textarea"], ["q4", "Check-in 4 — data e estado geral", "textarea"]]}];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Não foi possível salvar — armazenamento indisponível')}}
function exportData(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='metodo-reset-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup exportado')}catch(e){toast('Não foi possível exportar os dados')}}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=='object')throw new Error('formato inválido');if(!confirm('Importar vai substituir tudo que está salvo neste dispositivo agora (leitura, ferramentas, diário). Continuar?')){document.getElementById('import-file').value='';return}state=parsed;state.done=state.done||{};state.forms=state.forms||{};state.reminder=state.reminder||{enabled:false,time:'20:00',lastShown:null};state.journal=state.journal||[];state.profile=state.profile||null;save();render();toast('Dados importados com sucesso')}catch(e){toast('Arquivo inválido — não foi possível importar')}document.getElementById('import-file').value=''};reader.onerror=()=>{toast('Erro ao ler o arquivo');document.getElementById('import-file').value=''};reader.readAsText(file)}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function allChapters(){let a=[];DATA.forEach((p,pi)=>p.chapters.forEach((c,ci)=>a.push({p,pi,c,ci})));return a}
function numberedPartsCount(){return DATA.filter(p=>/^PARTE\s/i.test(p.title)).length}
function numberedChaptersCount(){return allChapters().filter(x=>/^Cap[ií]tulo\s/i.test(x.c.title)).length}
function chapterId(pi,ci){return pi+'-'+ci}function getTool(title){return toolDefs.find(x=>title.toLowerCase().includes(x.match.toLowerCase()))}
function toolHasData(key){const f=state.forms[key];if(!f)return false;return Object.values(f).some(v=>v===true||(typeof v==='string'&&v.trim()!==''))}
function go(v,pi=0,ci=0){current={view:v,part:pi,chapter:ci};render();window.scrollTo({top:0,behavior:'smooth'});if(innerWidth<801)document.getElementById('side').style.display='none'}
function toggleMenu(){const e=document.getElementById('side');e.style.display=e.style.display==='block'?'none':'block';e.style.position='fixed';e.style.zIndex='5';e.style.left='0';e.style.top='0'}
function progress(){const n=numberedChaptersCount();if(!n)return 0;const doneCount=allChapters().filter(x=>/^Cap[ií]tulo\s/i.test(x.c.title)&&state.done[chapterId(x.pi,x.ci)]).length;return Math.round(doneCount/n*100)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===current.view));const app=document.getElementById('app');if(current.view==='home')app.innerHTML=home();else if(current.view==='chapters')app.innerHTML=chapters();else if(current.view==='tools')app.innerHTML=tools();else if(current.view==='tool')app.innerHTML=toolPage(current.part);else if(current.view==='journal')app.innerHTML=journal();else if(current.view==='plan')app.innerHTML=plan();else app.innerHTML=readChapter();wireForms()}
function toggleExtra(id,btn){const el=document.getElementById(id);const open=el.style.display!=='none';el.style.display=open?'none':'block';btn.textContent=open?btn.dataset.moreLabel:'− Mostrar menos campos'}
function toolPage(idx){const t=toolDefs[idx];if(!t)return '<div class="empty">Ferramenta não encontrada.</div>';return `<button class="ghost back" onclick="go('tools')">← Ver todas as ferramentas</button><div class="card" style="max-width:640px;margin:0 auto"><div class="tool-recommend-banner">✦ Uma coisa de cada vez — preencha só o essencial, o resto pode esperar.</div>${renderTool(t,'tool'+idx)}<div class="actions" style="margin-top:18px"><button class="secondary" onclick="go('tools')">Ver todas as ferramentas</button><button class="ghost" onclick="go('home')">Voltar ao início</button></div></div>`}
function personalizedIntro(){if(!state.profile)return'';const m=MOTIVES.find(x=>x.key===state.profile.motive);if(!m)return'';const idx=toolDefs.findIndex(t=>t.title.toLowerCase().includes(m.toolMatch.toLowerCase()));return `<div class="welcome-card"><div class="eyebrow">Para você, ${esc(state.profile.name)}</div><h3>${m.icon} ${esc(m.label)}</h3><p class="muted" style="margin:0 0 12px">${esc(m.hint)}</p><div class="actions">${idx>-1?`<button class="primary" onclick="go('tool',${idx})">Abrir ferramenta sugerida →</button>`:''}<button class="ghost" onclick="openQuiz(true)">Refazer o quiz</button></div></div>`}
function home(){const p=progress();const first=allChapters()[0];return `${personalizedIntro()}<section class="hero"><div class="eyebrow">${state.profile?`Bem-vindo(a) de volta, ${esc(state.profile.name)}`:'Um guia prático para recomeçar'}</div><h1>Método RESET</h1><p>Como reconstruir sua vida depois que o chão desaparece — agora em uma leitura guiada, com ferramentas para preencher e um plano de 30 dias.</p><div class="actions"><button class="primary" onclick="go('chapter',${first.pi},${first.ci})">Começar a leitura</button><button class="secondary" onclick="go('tools')">Abrir ferramentas</button></div></section><div class="same-content-note">📘 <span>O PDF do Método RESET é <b>o mesmo conteúdo</b> deste app — mesma jornada, só em outro formato para consultar offline ou imprimir.</span></div><div class="kpi"><div class="card"><div class="muted">Progresso de leitura</div><div class="big">${p}%</div><div class="progress"><i style="width:${p}%"></i></div><div class="progress-note">Sem pressa — volte quando fizer sentido para você.</div></div><div class="card"><div class="muted">Capítulos</div><div class="big">${numberedChaptersCount()}</div><div class="muted">em ${numberedPartsCount()} partes</div></div><div class="card"><div class="muted">Princípio central</div><div><b>Reconhecer → Estabilizar → Sistematizar → Executar → Transformar</b></div></div></div><div class="card reminder-card" style="margin-top:18px"><h3>✦ Lembrete diário</h3><p class="muted">Receba um aviso no horário que você escolher para voltar ao método.</p><label class="check"><input type="checkbox" id="reminder-toggle" ${state.reminder.enabled?'checked':''} onchange="setReminder(this.checked,document.getElementById('reminder-time').value)">Ativar lembrete diário</label><label>Horário<input type="time" id="reminder-time" value="${esc(state.reminder.time)}" onchange="setReminder(document.getElementById('reminder-toggle').checked,this.value)"></label><div class="actions" style="margin-top:8px"><button class="ghost" onclick="testReminder()">Testar agora</button></div><div class="save-note">Funciona com o app aberto ou minimizado no navegador. No iPhone, funciona melhor se você adicionar o app à tela de início.</div></div><h2 style="margin-top:30px">Escolha um ponto de partida</h2><div class="grid">${DATA.map((p,i)=>`<button class="card part-card" style="text-align:left" onclick="go('chapters',${i})"><div class="part-num">Parte ${i+1}</div><h3>${esc(p.title.replace(/^PARTE [IVX]+ — /,'')||p.title)}</h3><p class="muted">${p.chapters.length} capítulos para avançar no seu ritmo.</p></button>`).join('')}</div><div class="disclaimer">Importante: este app organiza o conteúdo do livro, mas não é uma promessa de cura nem substitui ajuda profissional. Em sofrimento intenso, persistente ou com risco à própria segurança, procure um psicólogo, psiquiatra ou médico.</div>`}
function chapters(){let q='';return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Biblioteca</div><h2>Leia no seu ritmo</h2><p class="muted">Você pode voltar, marcar capítulos e usar as ferramentas quando fizer sentido.</p></div><input class="search" id="search" placeholder="Buscar capítulo ou palavra-chave…" oninput="filterChapters(this.value)"></div><div class="same-content-note">📘 <span>O PDF do Método RESET disponível para download é <b>o mesmo conteúdo</b> desta leitura — mesma jornada, só em outro formato para consultar offline ou imprimir.</span></div><div id="chapter-list">${chapterList()}</div>`}
function chapterList(q=''){return DATA.map((p,pi)=>{const cs=p.chapters.filter(c=>(c.title+' '+c.sections.map(s=>s.title+' '+s.paragraphs.join(' ')).join(' ')).toLowerCase().includes(q.toLowerCase()));if(!cs.length)return '';return `<div class="card" style="margin-bottom:16px"><div class="part-num">Parte ${pi+1}</div><h3>${esc(p.title.replace(/^PARTE [IVX]+ — /,'')||p.title)}</h3><div class="chapter-list">${cs.map(c=>{const ci=p.chapters.indexOf(c),id=chapterId(pi,ci);return `<button class="chapter-item" onclick="go('chapter',${pi},${ci})"><span>${state.done[id]?'✓':'○'}</span><b>${esc(c.title)}</b><small>${c.sections.length} seções</small></button>`}).join('')}</div></div>`}).join('')||'<div class="empty">Nenhum capítulo encontrado.</div>'}
function filterChapters(q){document.getElementById('chapter-list').innerHTML=chapterList(q)}
function renderTool(t, key){const saved=state.forms[key]||{};let inside='';if(t.fields){const rf=f=>f[2]==='textarea'?`<label>${esc(f[1])}<textarea data-form="${esc(key)}" data-field="${esc(f[0])}">${esc(saved[f[0]]||'')}</textarea></label>`:`<label>${esc(f[1])}<input type="text" data-form="${esc(key)}" data-field="${esc(f[0])}" value="${esc(saved[f[0]]||'')}"></label>`;const visible=t.fields.slice(0,3),extra=t.fields.slice(3);inside=visible.map(rf).join('');if(extra.length){const eid='ex-'+key.replace(/[^a-z0-9]/gi,'');const hasData=extra.some(f=>saved[f[0]]);inside+=`<div class="field-extra" id="${eid}" style="display:${hasData?'block':'none'}">${extra.map(rf).join('')}</div><button type="button" class="field-toggle" data-more-label="+ Mostrar mais ${extra.length} campo${extra.length>1?'s':''} (opcional)" onclick="toggleExtra('${eid}',this)">${hasData?'− Mostrar menos campos':'+ Mostrar mais '+extra.length+' campo'+(extra.length>1?'s':'')+' (opcional)'}</button>`}}if(t.checks)inside+=t.checks.map((x,i)=>`<label class="check"><input type="checkbox" data-form="${esc(key)}" data-check="${i}" ${saved['c'+i]?'checked':''}>${esc(x)}</label>`).join('');return `<div class="toolbox"><h4>✦ ${esc(t.title)}</h4><div class="muted">${esc(t.intro)}</div>${inside}<div class="save-note">Salvo automaticamente neste dispositivo.</div></div>`}
function chapterJumpSelect(){const arr=allChapters();const opts=arr.map(x=>`<option value="${x.pi}-${x.ci}" ${x.pi===current.part&&x.ci===current.chapter?'selected':''}>${esc(x.p.title.replace(/^PARTE [IVX]+ — /,''))} — ${esc(x.c.title)}</option>`).join('');return `<select class="chapter-jump" aria-label="Ir para outro capítulo" onchange="const v=this.value.split('-').map(Number);go('chapter',v[0],v[1])">${opts}</select>`}
function readChapter(){const p=DATA[current.part],c=p.chapters[current.chapter],id=chapterId(current.part,current.chapter),done=!!state.done[id];let body='';let chapterToolIdx=-1;c.sections.forEach((s,si)=>{if(!s.title){body+=s.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('');return}const tool=getTool(s.title);if(tool&&chapterToolIdx===-1)chapterToolIdx=toolDefs.indexOf(tool);const summary=s.title.toLowerCase().includes('resumo acionável');body+=`<section class="section ${summary?'summary':''}"><h3>${esc(s.title)}</h3>${tool?renderTool(tool,'ch'+id+'-'+si):''}${s.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')}</section>`});const toolCta=chapterToolIdx>-1?`<div class="chapter-tool-cta"><div><h4>✦ ${esc(toolDefs[chapterToolIdx].title)}</h4><p>${esc(toolDefs[chapterToolIdx].intro)}</p></div><button class="primary" onclick="go('tool',${chapterToolIdx})">Abrir ${esc(toolDefs[chapterToolIdx].title)} →</button></div>`:'';const arr=allChapters(),idx=arr.findIndex(x=>x.pi===current.part&&x.ci===current.chapter),prev=arr[idx-1],next=arr[idx+1];return `<div class="chapter-topbar"><button class="ghost back" onclick="go('chapters',${current.part})">← Voltar aos capítulos</button>${chapterJumpSelect()}</div><article class="chapter"><div class="part-num">${esc(p.title)}</div><h1 class="chapter-title">${esc(c.title)}</h1><div class="actions"><button class="${done?'secondary':'primary'}" onclick="toggleDone('${id}')">${done?'✓ Capítulo concluído':'Marcar como concluído'}</button><button class="ghost" onclick="go('tools')">Ver todas as ferramentas</button></div>${body}${toolCta}<div class="chapter-nav">${prev?`<button class="ghost" onclick="go('chapter',${prev.pi},${prev.ci})">← ${esc(prev.c.title)}</button>`:'<span></span>'}${next?`<button class="primary" onclick="go('chapter',${next.pi},${next.ci})">${esc(next.c.title)} →</button>`:''}</div></article>`}
function toggleDone(id){if(state.done[id])delete state.done[id];else state.done[id]=true;save();render();toast(state.done[id]?'Capítulo marcado como concluído':'Marca removida')}
function tools(){const m=state.profile?MOTIVES.find(x=>x.key===state.profile.motive):null;const recIdx=m?toolDefs.findIndex(t=>t.title.toLowerCase().includes(m.toolMatch.toLowerCase())):-1;const recBanner=recIdx>-1?`<div class="tool-recommend-banner">✦ Sugerida para você: <b style="color:var(--gold-soft);margin-left:4px">${esc(toolDefs[recIdx].title)}</b><button class="ghost" style="margin-left:auto" onclick="go('tool',${recIdx})">Abrir →</button></div>`:'';return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Caderno de prática</div><h2>Ferramentas RESET</h2><p class="muted">Preencha só o que for útil agora. Tudo fica salvo localmente no navegador.</p></div></div>${recBanner}<div class="tool-grid">${toolDefs.map((t,i)=>{const filled=toolHasData('tool'+i);return `<div class="tool-card">${filled?'<span class="tool-done-badge">✓ Preenchido</span>':''}<h3>${esc(t.title)}</h3><p class="muted">${esc(t.intro)}</p><button class="ghost" onclick="go('tool',${i})">Abrir ferramenta →</button></div>`}).join('')}</div><div class="disclaimer">As ferramentas são educativas e de organização pessoal. Não substituem avaliação ou acompanhamento profissional.</div>`}
function plan(){const t=toolDefs.find(x=>x.match==='Cronograma RESET de 30 Dias');return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Próximos passos</div><h2>Plano de 30 dias</h2><p class="muted">Uma sequência, não uma corrida. Avance apenas quando sua prontidão indicar.</p></div></div><div class="card">${renderTool(t,'plan')}</div><div class="grid" style="margin-top:16px"><div class="card"><h3>Semana 1</h3><p>Reconhecer e começar a estabilizar. Preencha a Matriz da Queda, o checklist de sintomas e a Escala de Prontidão.</p></div><div class="card"><h3>Semanas 2 e 3</h3><p>Completar a estabilização e iniciar a sistematização. Repita se ainda não estiver pronto.</p></div><div class="card"><h3>Semana 4</h3><p>Executar e revisar. Sustente um hábito pequeno e use o Protocolo de Recaída quando necessário.</p></div><div class="card"><h3>Regra de segurança</h3><p>Trinta dias estabelecem bases; não prometem uma reconstrução completa. O ritmo certo é o seu.</p></div></div>`}
function wireForms(){document.querySelectorAll('[data-form]').forEach(e=>{e.addEventListener('input',()=>{const k=e.dataset.form;state.forms[k]=state.forms[k]||{};state.forms[k][e.dataset.field]=e.type==='checkbox'?e.checked:e.value;save()});e.addEventListener('change',()=>{const k=e.dataset.form;state.forms[k]=state.forms[k]||{};if(e.dataset.check!==undefined)state.forms[k]['c'+e.dataset.check]=e.checked;save()})})}
function checkReminder(){if(!state.reminder||!state.reminder.enabled||!state.reminder.time)return;const now=new Date(),today=now.toISOString().slice(0,10);const[h,m]=state.reminder.time.split(':').map(Number);const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);if(now>=target&&state.reminder.lastShown!==today){state.reminder.lastShown=today;save();fireReminder('Hora do seu momento RESET diário ✦')}}
function fireReminder(msg){toast(msg);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Método RESET',{body:msg})}catch(e){}}}
function setReminder(enabled,time){state.reminder=state.reminder||{};state.reminder.enabled=enabled;if(time)state.reminder.time=time;if(enabled&&'Notification'in window&&Notification.permission==='default'){Notification.requestPermission()}save();checkReminder();render()}
function testReminder(){if('Notification'in window&&Notification.permission==='default'){Notification.requestPermission().then(()=>fireReminder('Teste de lembrete diário ✦'))}else{fireReminder('Teste de lembrete diário ✦')}}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function journal(){const entries=(state.journal||[]).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const editing=journalEdit!==null?entries.find(e=>e.id===journalEdit):null;return `<div class="section-head"><div><div class="eyebrow" style="color:var(--gold)">Espaço livre</div><h2>Diário</h2><p class="muted">Escreva o que quiser, sem estrutura. Só para você — não entra nos capítulos nem nas ferramentas.</p></div></div><div class="card journal-box"><label style="display:block;font-weight:700;margin-bottom:6px">${editing?'Editando nota':'Nova nota'}</label><div class="mood-picker"><span class="muted" style="display:block;margin-bottom:8px;font-size:14px">Como você está agora? (opcional)</span><div class="mood-row">${MOODS.map(m=>`<button type="button" class="mood-btn ${journalMood===m.key?'active':''}" onclick="setJournalMood('${m.key}')" aria-label="${esc(m.label)}" title="${esc(m.label)}">${m.emoji}</button>`).join('')}</div></div><textarea id="journal-input" placeholder="O que está passando pela sua cabeça hoje?">${editing?esc(editing.text):''}</textarea><div class="actions" style="margin-top:10px"><button class="primary" onclick="saveJournalEntry()">${editing?'Salvar alterações':'Salvar nota'}</button>${editing?'<button class="ghost" onclick="cancelJournalEdit()">Cancelar</button>':''}</div></div><div class="chapter-list">${entries.length?entries.map(e=>{const mo=MOODS.find(x=>x.key===e.mood);return `<div class="card journal-entry" style="margin-bottom:10px"><div class="muted">${mo?mo.emoji+' ':''}${fmtDate(e.createdAt)}${e.editedAt?' · editado':''}</div><p>${esc(e.text)}</p><div class="actions"><button class="ghost" onclick="editJournalEntry(${e.id})">Editar</button><button class="ghost" onclick="deleteJournalEntry(${e.id})">Excluir</button></div></div>`}).join(''):'<div class="empty">Ainda não há nenhuma nota. Escreva a primeira acima.</div>'}</div>`}
function setJournalMood(key){journalMood=journalMood===key?null:key;render()}
function saveJournalEntry(){const el=document.getElementById('journal-input'),text=el.value.trim();if(!text)return;state.journal=state.journal||[];if(journalEdit!==null){const entry=state.journal.find(e=>e.id===journalEdit);if(entry){entry.text=text;entry.mood=journalMood;entry.editedAt=new Date().toISOString()}journalEdit=null}else{state.journal.push({id:Date.now(),text,mood:journalMood,createdAt:new Date().toISOString()})}journalMood=null;save();render();toast('Nota salva')}
function editJournalEntry(id){journalEdit=id;const entry=(state.journal||[]).find(e=>e.id===id);journalMood=entry?entry.mood||null:null;render();window.scrollTo({top:0,behavior:'smooth'})}
function cancelJournalEdit(){journalEdit=null;journalMood=null;render()}
function deleteJournalEntry(id){if(!confirm('Excluir esta nota? Essa ação não pode ser desfeita.'))return;state.journal=(state.journal||[]).filter(e=>e.id!==id);save();render();toast('Nota excluída')}

let quizStep=0,quizName='';
function quizStepHtml(){
  const dots=`<div class="quiz-dots"><span class="${quizStep===0?'on':''}"></span><span class="${quizStep===1?'on':''}"></span></div>`;
  if(quizStep===0){
    return `<div class="quiz-step active"><div class="quiz-mark">R</div>${dots}<h2>Bem-vindo(a) ao Método RESET</h2><p class="muted">Duas perguntas rápidas para deixar sua experiência mais direta ao ponto. Leva menos de 30 segundos.</p><label style="font-weight:700;display:block;margin-bottom:6px">Como podemos te chamar?</label><input type="text" id="quiz-name" maxlength="40" placeholder="Seu nome" value="${esc(quizName)}" autocomplete="given-name"><div class="quiz-actions"><button class="quiz-skip" onclick="skipQuiz()">Pular</button><button class="primary" onclick="quizNext()">Continuar →</button></div></div>`;
  }
  return `<div class="quiz-step active"><div class="quiz-mark">R</div>${dots}<h2>O que te trouxe até aqui${quizName?', '+esc(quizName):''}?</h2><p class="muted">Isso ajuda a sugerir por onde começar. Você pode mudar isso depois.</p><div class="motive-list">${MOTIVES.map(m=>`<button class="motive-opt" onclick="finishQuiz('${m.key}')"><span class="em">${m.icon}</span><span>${esc(m.label)}</span></button>`).join('')}</div><div class="quiz-actions"><button class="quiz-skip" onclick="quizStep=0;renderQuiz()">← Voltar</button><button class="quiz-skip" onclick="skipQuiz()">Pular</button></div></div>`;
}
function renderQuiz(){document.getElementById('quiz-overlay').innerHTML=`<div class="quiz-card">${quizStepHtml()}</div>`;if(quizStep===0)setTimeout(()=>{const el=document.getElementById('quiz-name');if(el)el.focus()},50)}
function openQuiz(reset){quizStep=0;quizName=reset&&state.profile?state.profile.name:'';document.getElementById('quiz-overlay').style.display='flex';renderQuiz()}
function closeQuizOverlay(){document.getElementById('quiz-overlay').style.display='none'}
function helpContent(){return `<div class="help-card"><button class="help-close" onclick="closeHelp()" aria-label="Fechar">✕</button><div class="quiz-mark">✦</div><h2>Você não precisa passar por isso sozinho(a)</h2><p class="muted">Se agora estiver difícil demais, ou se houver risco à sua segurança, este app não é suficiente — e tudo bem buscar ajuda agora. Ligar não custa nada e é sigiloso.</p><div class="help-item"><strong>CVV — Centro de Valorização da Vida</strong><p class="muted">Apoio emocional gratuito, sigiloso, 24 horas por dia, todos os dias.</p><div class="actions"><a class="primary" href="tel:188">Ligar para 188</a><a class="ghost" href="https://www.cvv.org.br/chat/" target="_blank" rel="noopener">Conversar por chat</a></div></div><div class="help-item"><strong>Risco imediato à vida</strong><p class="muted">Em emergência médica ou de segurança, ligue agora.</p><div class="actions"><a class="ghost" href="tel:192">SAMU — 192</a><a class="ghost" href="tel:190">Polícia — 190</a></div></div></div>`}
function openHelp(){document.getElementById('help-overlay').innerHTML=helpContent();document.getElementById('help-overlay').style.display='flex'}
function closeHelp(){document.getElementById('help-overlay').style.display='none'}
function quizNext(){const v=document.getElementById('quiz-name').value.trim();quizName=v;quizStep=1;renderQuiz()}
function finishQuiz(motiveKey){state.profile={name:quizName||'Você',motive:motiveKey};save();closeQuizOverlay();const m=MOTIVES.find(x=>x.key===motiveKey);const idx=m?toolDefs.findIndex(t=>t.title.toLowerCase().includes(m.toolMatch.toLowerCase())):-1;if(idx>-1){go('tool',idx)}else{render()}toast('Tudo pronto, '+state.profile.name+'!')}
function skipQuiz(){state.profile=state.profile||{name:'Você',motive:null};save();closeQuizOverlay();render()}
function initNativeFullscreen(){try{if(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()){const SB=window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;if(SB){SB.setOverlaysWebView({overlay:true});SB.hide();}}}catch(e){}}
render();checkReminder();setInterval(checkReminder,60000);initNativeFullscreen();
if(!state.profile){setTimeout(()=>openQuiz(false),350)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').catch(()=>{})})}
</script></body></html>
